[project]
name = "file_extractor"
version = "0.1.0"
description = "Backend service for downloading, extracting and storing files from external API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "aiobotocore>=2.15.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-docker>=3.1.0",
    "testcontainers[postgresql,minio]>=4.8.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "coverage>=7.6.0",
    "debugpy>=1.8.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/presentation/api/routes.py" = ["B008"]
"app/worker/celery_tasks.py" = ["B008"]
"app/presentation/api/deps.py" = ["B008"]



[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "app.worker.celery_tasks"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.worker.watchdog"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
